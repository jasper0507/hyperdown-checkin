# Hyperdown 每日自动签到。保活见 keepalive.yml。
name: Hyperdown Check-in

on:
  workflow_dispatch:
  schedule:
    # UTC 00:05 ≈ 北京 08:05
    - cron: "5 0 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run check-in
        env:
          HYPERDOWN_EMAIL: ${{ secrets.HYPERDOWN_EMAIL }}
          HYPERDOWN_PASSWORD: ${{ secrets.HYPERDOWN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HYPERDOWN_EMAIL:-}" ] || [ -z "${HYPERDOWN_PASSWORD:-}" ]; then
            echo "::error::缺少 Secrets：请配置 HYPERDOWN_EMAIL 与 HYPERDOWN_PASSWORD"
            exit 1
          fi
          python checkin.py
